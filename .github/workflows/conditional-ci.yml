    runs-on: ubuntu-latest
    steps:
      - name: Build step
        run: echo "BUILDING STEP"
  test:
    if: startsWith(github.ref, 'refs/heads/feature/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Test step
        run: echo "TESTING STEP"


